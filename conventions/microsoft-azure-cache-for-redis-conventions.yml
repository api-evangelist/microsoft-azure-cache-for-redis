idempotency:
  mechanism: idempotent HTTP verbs (resource-identity PUT), not an Idempotency-Key header
  header: null
  retention: null
  coverage: partial
  scope:
  - Redis_Create
  - Redis_Update
  - Redis_Delete
  - FirewallRules_CreateOrUpdate
  - FirewallRules_Delete
  - PatchSchedules_CreateOrUpdate
  - PatchSchedules_Delete
  - LinkedServer_Create
  - LinkedServer_Delete
  - AccessPolicy_CreateUpdate
  - AccessPolicy_Delete
  - AccessPolicyAssignment_CreateUpdate
  - AccessPolicyAssignment_Delete
  - PrivateEndpointConnections_Put
  - PrivateEndpointConnections_Delete
  not_covered:
  - Redis_ExportData
  - Redis_ImportData
  - Redis_FlushCache
  - Redis_ForceReboot
  - Redis_RegenerateKey
  - Redis_ListKeys
  note: >-
    15 of the 20 mutating operations are addressed PUT/DELETE by resource name, so a retry
    after a lost response converges on the same state — that is replay protection by identity.
    The 5 POST action operations are NOT protected: a replayed Redis_RegenerateKey rotates the
    key a second time, a replayed Redis_ForceReboot reboots again, and a replayed
    Redis_ImportData re-runs an import that deletes preexisting cache data. There is no
    Idempotency-Key header anywhere in the surface, so an agent cannot make those five safe.
    Hence partial, not full.
reversibility:
  grade: documented
  note: >-
    Reversal paths exist and are documented for two of the write surfaces; NO published
    document states a window for any of them, so this grades documented rather than verified.
  surfaces:
  - operation: Redis_ExportData
    reversal: Redis_ImportData
    reversal_operation: Redis_ImportData
    window: null
    docs: https://learn.microsoft.com/en-us/azure/azure-cache-for-redis/cache-how-to-import-export-data
    note: >-
      An exported RDB blob can be imported back into a cache. The docs state importing
      "deletes preexisting cache data" and the cache is unreachable during the import, so the
      restore is itself destructive. No retention window is stated — the blob lives in the
      customer's own storage account for as long as they keep it.
  - operation: Redis_Update
    reversal: Redis_Update (scale back)
    reversal_operation: Redis_Update
    window: null
    docs: https://learn.microsoft.com/en-us/azure/azure-cache-for-redis/cache-how-to-scale
    note: >-
      Scale up can be reversed by scaling down on Basic/Standard/Premium ("When you scale down,
      the reverse happens"). Enterprise and Enterprise Flash CANNOT be reversed — the docs say
      plainly "You can only scale up at this time. You can't scale down."
  - operation: Redis_Delete
    reversal: null
    window: null
    note: >-
      No restore, undelete or soft-delete operation exists in the contract and none is
      documented. Deleting a cache is final; data is recoverable only from a customer-owned
      persistence/export blob taken beforehand.
  - operation: Redis_FlushCache
    reversal: null
    window: null
    note: Flush deletes all keys. No reversal operation exists.
  - operation: Redis_RegenerateKey
    reversal: null
    window: null
    note: >-
      Rotating an access key invalidates the old one immediately. Regenerating the other key
      does not restore it.
