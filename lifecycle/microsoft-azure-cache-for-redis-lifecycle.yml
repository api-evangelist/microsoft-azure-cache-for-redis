headline: >-
  THE SERVICE ITSELF IS RETIRING. Microsoft announced in October 2025 the retirement of every
  Azure Cache for Redis SKU. Enterprise and Enterprise Flash are migrated to Azure Managed
  Redis on 2027-03-31; Basic, Standard and Premium are turned off on 2028-09-30. The REST
  contract in openapi/ is real and current, and it describes a product with a published end
  date.
