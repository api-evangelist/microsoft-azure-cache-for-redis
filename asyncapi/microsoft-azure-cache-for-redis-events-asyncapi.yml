asyncapi: 3.0.0
info:
  title: Azure Cache for Redis — Event Grid events
  version: '1.0'
  description: >-
    The four events Azure Cache for Redis publishes to Azure Event Grid. Derived by API
    Evangelist from Microsoft's published event catalog and payload samples at
    https://learn.microsoft.com/en-us/azure/event-grid/event-schema-azure-cache — Microsoft
    does not publish an AsyncAPI document for this surface. Event names, payload fields and
    example values are Microsoft's, verbatim; the AsyncAPI framing is ours.
    Subscribers receive these over a webhook (HTTP POST), an Event Hub, a Service Bus queue or
    topic, a storage queue, a relay hybrid connection, or an Azure Function.
  contact:
    name: Azure Cache for Redis documentation
    url: https://learn.microsoft.com/en-us/azure/azure-cache-for-redis/
x-generated-by: API Evangelist enrichment pipeline
x-generated-from: https://learn.microsoft.com/en-us/azure/event-grid/event-schema-azure-cache
