domain_standards:
- id: redis-protocol
  name: Redis serialization protocol / Redis command surface
  conforms: true
  scope: data plane
  evidence: >-
    The service runs the open-source Redis software and is spoken to with ordinary Redis
    clients; the control-plane contract in openapi/ models redisVersion, redisConfiguration and
    Redis modules (RedisBloom, RedisJSON, RediSearch, RedisTimeSeries) as first-class
    properties. A consumer who already speaks Redis needs no bespoke connector for the data
    plane. NOTE: the data plane is NOT described by an OpenAPI and is not in openapi/.
