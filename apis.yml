description: >-
  Azure Cache for Redis is Microsoft's managed in-memory data store built on the open-source
  Redis software, used to put a low-latency cache, session store or message broker in front of a
  slower backing store. This record covers the management (control-plane) REST API — the
  Microsoft.Cache/redis resource provider on Azure Resource Manager — which creates, scales,
  secures, backs up and deletes caches across the Basic, Standard, Premium, Enterprise and
  Enterprise Flash tiers. The Redis data plane itself is plain Redis, spoken with an ordinary
  Redis client and not described by an OpenAPI. Microsoft announced in October 2025 that every
  Azure Cache for Redis SKU is retiring: Enterprise and Enterprise Flash on 2027-03-31, Basic,
  Standard and Premium on 2028-09-30, with Azure Managed Redis as the successor.
