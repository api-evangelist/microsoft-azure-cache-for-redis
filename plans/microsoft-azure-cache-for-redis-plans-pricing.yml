description: >-
  Published tiers for Azure Cache for Redis, priced per cache instance per hour. There is no
  request quota and no free tier: you pay for a provisioned cache by SKU size, not per API call.
  The management REST API in openapi/ is itself free to call — it is billed only through the
  Azure Resource Manager platform, which does not charge per request.
currency: USD
region_priced: eastus
billing:
  unit: 1 Hour
  model: provisioned instance, billed hourly, pro-rated
  commitment_options: >-
    Reserved capacity (1-year and 3-year) is offered on Enterprise, Enterprise Flash and Azure
    Managed Redis SKUs; those Reservation rows are present in the same API response and are not
    itemised here.
  api_call_charges: none
retirement_notice: >-
  Every tier below is retiring. Enterprise and Enterprise Flash are migrated to Azure Managed
  Redis on 2027-03-31; Basic, Standard and Premium are turned off on 2028-09-30. See
  lifecycle/microsoft-azure-cache-for-redis-lifecycle.yml. Azure Managed Redis SKUs are listed
  here for the migration path only — they are a different product and a different resource
  provider.
